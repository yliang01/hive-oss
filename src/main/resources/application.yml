spring.profiles.active: prod

spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      enabled: false
  datasource:
    url: "jdbc:h2:tcp://127.0.0.1:9092/./hive;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: "sa"
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
#    show-sql: true

hive:
  oss:
    part:
      size: 10
    concurrency: 4
    tencent:
      enabled: false
  downloadDir: "${user.home}/Desktop/hive/download"
  imageCacheDir: "${user.home}/Desktop/hive/image-cache"
  imageCacheTtlDays: 7
  h2:
    server:
      enabled: true
      port: 9092
      baseDir: "${user.home}/Desktop/hive/db"
      allowOthers: false
  preview:
    max-size-bytes: 10485760

backup:
  dir: "${user.home}/Desktop/hive/backup"
  database:
    type: h2
  h2:
    jdbcUrl: "jdbc:h2:tcp://127.0.0.1:9092/./hive;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password: ""
