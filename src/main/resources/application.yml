spring.config.import: classpath:external-secret.yml
spring.profiles.active: prod

spring:
  servlet:
    multipart:
      enabled: false

hive:
  downloadDir: C:\Users\YLiang\Downloads\hive\download\
  imageCacheDir: ./data/image-cache
  imageCacheTtlDays: 7
  h2:
    server:
      enabled: true
      port: 9092
      baseDir: ./data/db
      allowOthers: false
