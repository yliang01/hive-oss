spring.config.import: optional:file:./config/external-secret.yml
spring.profiles.active: prod

spring:
  servlet:
    multipart:
      enabled: false
  datasource:
    url: "jdbc:h2:tcp://127.0.0.1:9092/./hive;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: "sa"
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
#    show-sql: true

hive:
  downloadDir: C:\Users\YLiang\Downloads\hive\download\
  imageCacheDir: ./data/image-cache
  imageCacheTtlDays: 7
  h2:
    server:
      enabled: true
      port: 9092
      baseDir: ./data/db
      allowOthers: false
  preview:
    max-size-bytes: 10485760

backup:
  database:
    type: h2
  h2:
    jdbcUrl: jdbc:h2:tcp://127.0.0.1:9092/./hive;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
